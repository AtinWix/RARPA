<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RARPA Progress Tasks</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1c2433;--muted:#5b6677;--line:#d7dde7;--brand:#1f5fa8;--brand2:#e7effa;--good:#1b7f45;--goodbg:#dff2e6;--mid:#a86200;--midbg:#fcefd9;--bad:#b0281f;--badbg:#fbe3e1}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,Arial,Verdana,sans-serif;font-size:16px;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
button.warn{color:var(--bad)}
button:hover{filter:brightness(.95)}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
textarea{resize:vertical;min-height:56px}
label{font-size:13px;color:var(--muted);display:block;margin:0 0 3px}
.hide{display:none!important}
.note{font-size:14px;color:var(--muted)}
.flexbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}
.logo{display:flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;font-size:13px;white-space:nowrap}
.logo svg{height:30px;width:auto}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1c2433;color:#fff;padding:7px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:.92}
.badge{font-size:13px;padding:3px 8px;border-radius:20px;background:#eef1f5;color:var(--muted);white-space:nowrap;display:inline-block}
.badge.good{background:var(--goodbg);color:var(--good)}.badge.mid{background:var(--midbg);color:var(--mid)}.badge.bad{background:var(--badbg);color:var(--bad)}

/* ---------- learner screens ---------- */
#lm{min-height:100vh;background:#fff;padding:18px 18px 60px}
.lbar{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto 10px;gap:10px}
.lwrap{max-width:900px;margin:0 auto;text-align:center}
.lwrap h1{font-size:36px;margin:10px 0 18px}
.lwrap h2{font-size:30px;margin:6px 0 16px}
.big{font-size:26px;padding:14px 22px;border-radius:12px;border-width:2px}
.bigin{font-size:28px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;text-align:center;max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.chips button{font-size:22px;padding:10px 18px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:10px}
.tcard{font-size:22px;padding:18px 12px;border:2px solid var(--line);border-radius:14px;background:#fbfcfe;text-align:center}
.tcard em{display:block;font-style:normal;font-size:50px;line-height:1.1}
.tcard small{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.dots{display:flex;justify-content:center;gap:8px;margin:6px 0 14px}
.dots span{width:16px;height:16px;border-radius:50%;background:#d7dde7}
.dots .now{background:var(--brand)}.dots .ok{background:var(--good)}.dots .no{background:var(--bad)}.dots .done{background:#8aa4c6}
.qbox{border:2px solid var(--line);border-radius:16px;padding:18px;margin:0 auto 16px;max-width:760px;background:#fbfcfe}
.qtext{font-size:28px;margin:8px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;margin:0 auto}
.opts button{font-size:24px;padding:16px 10px;border-width:2px;border-radius:12px;min-height:70px}
.opts button.right{background:var(--goodbg);border-color:var(--good)}
.opts button.wrong{background:var(--badbg);border-color:var(--bad)}
.shop{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.shop div{border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-size:24px;background:#fff;min-width:130px}
.shop em{display:block;font-style:normal;font-size:46px}
.sign{display:inline-block;font-size:40px;font-weight:800;letter-spacing:1px;padding:16px 28px;border-radius:10px;border:5px solid}
.wline{min-height:66px;border-bottom:3px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px;margin:0 auto 14px;max-width:760px;font-size:26px}
.wchips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.wchips button,.wline button{font-size:26px;padding:10px 16px;border-width:2px;border-radius:10px}
.wline button{background:var(--brand2);border-color:var(--brand)}
.fb{font-size:24px;margin:12px 0;min-height:34px}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.faces{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:820px;margin:0 auto}
.faces button{flex:1;min-width:120px;font-size:18px;padding:12px 6px;border-width:2px}
.faces em{display:block;font-style:normal;font-size:40px}
.faces button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.score{font-size:64px;font-weight:800;color:var(--brand);margin:6px 0}
.hist{display:flex;justify-content:center;gap:14px;align-items:flex-end;margin:16px 0;flex-wrap:wrap}
.hist div{display:flex;flex-direction:column;align-items:center;font-size:16px;color:var(--muted)}
.hist i{display:block;width:44px;background:var(--brand);border-radius:6px 6px 0 0}
.hist b{color:var(--ink);font-size:20px}
.review{max-width:760px;margin:10px auto;text-align:left;border-collapse:collapse;width:100%;font-size:20px}
.review td{border:1px solid var(--line);padding:8px}
.wbox{width:100%;max-width:820px;min-height:280px;font-size:22px;line-height:1.5;font-family:Verdana,Arial,sans-serif;border:2px solid var(--line);border-radius:12px;padding:12px}
.wtext{text-align:left;font-size:18px;line-height:1.55;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:Verdana,Arial,sans-serif}
.wtext mark{background:#fff3a0;padding:0 2px;border-radius:3px}
.wtext .err{background:var(--badbg);color:var(--bad);font-weight:700;text-decoration:underline}
.wcheck{list-style:none;padding:0;margin:8px 0;text-align:left}
.wcheck li{padding:3px 0}
.lvbar{display:flex;gap:8px;justify-content:center;align-items:center;margin:0 0 12px;font-size:20px}
.lvbar button{font-size:20px;padding:6px 16px}
.slipinfo{display:none}
.rmx{display:inline-block;margin-left:10px;padding:0 7px;border-radius:50%;color:var(--bad);font-weight:700;font-size:.85em;line-height:1.5}
.rmx:hover{background:var(--badbg)}
.tlink{position:fixed;right:10px;bottom:10px;font-size:13px;padding:4px 10px;opacity:.6}

/* ---------- teacher ---------- */
#tm header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#tm header h1{font-size:20px;margin:0 auto 0 0}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
aside,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
aside h2,.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:16px;margin:16px 0 8px}
.lrn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;margin:0 0 6px;padding:8px 10px}
.lrn.on{background:var(--brand2);border-color:var(--brand)}
.sdots span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:3px;background:#ccd3de}
.sdots .good{background:var(--good)}.sdots .mid{background:var(--mid)}.sdots .bad{background:var(--bad)}
.tgt{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;background:#fbfcfe}
.tgt h4{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.priv{background:#fff8e1;border:1px solid #f0d78a;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--brand2)}
td.ok{background:var(--goodbg)}td.no{background:var(--badbg)}
.hl{background:#fff3c4;border-left:4px solid #e0b100;padding:6px 10px;border-radius:4px;margin:6px 0;font-size:15px}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.ev h5{margin:0 0 4px;font-size:14px}
.mini svg{width:56px;height:56px;vertical-align:middle}
.chart{display:flex;gap:8px;align-items:flex-end;height:90px;margin:6px 0 2px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.chart div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.chart i{display:block;width:30px;background:var(--brand);border-radius:4px 4px 0 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.chart b{font-size:12px;color:var(--ink)}
.page{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin:0 auto 16px;max-width:950px}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--brand);padding-bottom:8px;margin-bottom:12px;gap:10px}
.rhead h2{margin:0;font-size:20px}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px;font-size:14px}
.sig div{border-top:1px solid var(--ink);padding-top:4px}
@media (max-width:760px){.wrap{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.ev{grid-template-columns:1fr}}
@media print{
  body{background:#fff;font-size:11pt}
  #tm header,aside,.noprint,.toast,#lm{display:none!important}
  body.plm #lm{display:block!important;padding:0}
  body.plm #lm button,body.plm .faces{display:none!important}
  body.plm .slipinfo{display:block}
  body.plm #tm{display:none!important}
  mark,.err,.review td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{display:block;padding:0}
  .page{border:none;border-radius:0;padding:0;margin:0;max-width:none;page-break-after:always}
  .page:last-child{page-break-after:auto}
  th,td.ok,td.no,.badge,.hl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tgtev{page-break-inside:avoid}
}
</style>
</head>
<body>

<div id="lm"></div>

<div id="tm" class="hide">
  <header>
    <h1>RARPA Progress Tasks – Teacher</h1>
    <button id="bEdit" class="pri">Learners</button>
    <button id="bTasks">Tasks</button>
    <button id="bReport">Reports</button>
    <button id="bImport">Import results</button>
    <button id="bBackup">Save backup</button>
    <button id="bCsv">Export for Excel</button>
    <button id="bCopy">Make student copy</button><button id="bLink">Copy student link</button>
    <button id="bLearnerMode">Learner screen</button><button id="bkStat" class="noprint"></button>
    <input type="file" id="fImport" accept=".json,.xlsx,.csv" multiple class="hide">
    <div class="logo" title="made by Atin"><span class="lg"></span>made by Atin</div>
  </header>
  <div class="wrap">
    <aside class="noprint">
      <button class="lrn" id="classBtn"><b>Class details &amp; how to use</b></button>
      <h2 style="margin-top:12px">Learners</h2>
      <div id="lrnList"></div>
      <div class="flexbar" style="margin-top:8px">
        <input id="newName" placeholder="Learner name">
        <button class="pri" id="addL">Add learner</button>
      </div>
      <button id="pasteBtn" style="width:100%;margin-top:8px">📋 Paste a class list</button>
      <p class="note">Learners who type their name on the learner screen are added automatically.</p>
    </aside>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let CFG=/*CFG*/null/*CFG*/;
const SRC=document.documentElement.outerHTML;
let HASHCFG=false;try{const h=location.hash.match(/^#cfg=(.+)$/);if(h){CFG=JSON.parse(decodeURIComponent(escape(atob(h[1].replace(/-/g,'+').replace(/_/g,'/')))));HASHCFG=true}}catch(e){}
const LOGO='<svg viewBox="0 0 74 40" aria-hidden="true"><text x="0" y="31" font-family="Arial" font-size="32" font-weight="700" fill="#1f5fa8">A</text><rect x="24" y="19" width="10" height="4" rx="1" fill="#1f5fa8"/><g transform="translate(40 6)" fill="none" stroke="#1f5fa8" stroke-width="2.5"><path d="M2 8v22c0 2.5 9 4 15 4s15-1.5 15-4V8"/><ellipse cx="17" cy="8" rx="15" ry="4"/><path d="M5 15c6 2 18 2 24 0M5 23c6 2 18 2 24 0"/><path d="M4 6 L14 -5 L30 1"/></g></svg>';
document.querySelectorAll('.lg').forEach(e=>e.innerHTML=LOGO);
const logoHTML=`<div class="logo">${LOGO}made by Atin</div>`;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(a,n)=>shuffle(a).slice(0,n);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const today=()=>new Date().toISOString().slice(0,10);
const ukDate=d=>d?d.slice(0,10).split('-').reverse().join('/'):'';
const shortDate=d=>{if(!d)return'';const x=new Date(d);return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const nkey=n=>String(n||'').trim().toLowerCase().replace(/\s+/g,' ');
const tidyName=n=>String(n||'').trim().replace(/\s+/g,' ').replace(/\b\p{Ll}/gu,c=>c.toUpperCase());
const money=p=>'£'+(p/100).toFixed(2);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name.replace(/[\\/:*?"<>|]/g,'-');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
const LEVELS=['E1','E2','E3','L1'];
const FACES=[['😟','I can’t'],['🙁','A little'],['😐','Sometimes'],['🙂','Usually'],['😀','Yes, easily']];

/* ---------- storage ---------- */
const KEY='rarpa-tasks-v2';
const DEFAULT_FORM='https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mUft038080m159qCPJXo2Y1qZCuioLZMr502V7pP7tRUMzQ2TDlLWjEwMTZPNjdKTUlMWkRFVkw3NSQlQCNjPTEu&rc9dfa2c6731d4979a3e9533bd4485c07=NAME&rf50c2f0507a74e458057ea3e4341eca9=TASK&rc73d1e972051428bb9b892d689b3ccef=SCORE&rfa329034236d4d74b3f96807c993b099=DATA';
function blank(){return{cls:{name:'',level:'E1',teacher:'Atin',college:'New City College – Hackney',year:'2026–27',pin:'',items:5},learners:[],custom:[]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.learners)){d.custom=d.custom||[];return d}}catch(e){}return blank()}
let S=load();
if(!S.cls.form)S.cls.form=DEFAULT_FORM;
if(CFG){Object.assign(S.cls,{level:CFG.level,items:CFG.items,pin:CFG.pin,name:CFG.name||S.cls.name,form:CFG.form||'',practice:!!CFG.practice});(CFG.custom||[]).forEach(c=>{const i=S.custom.findIndex(x=>x.id===c.id);if(i<0)S.custom.push(c);else S.custom[i]=c})}
let saveT;function save(quiet,noTouch){S.dirty=true;if(!noTouch){const l=typeof L==='function'&&L();if(l)l.upd=Date.now()}clearTimeout(saveT);if(typeof bkStat==='function')bkStat();saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));if(!quiet)toast('Saved on this computer')}catch(e){toast('Could not save here – use Save backup')}},250)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function newLearner(name){return{id:uid(),name:tidyName(name),targets:[],attempts:[],teacherNote:'',learnerNote:''}}
const byName=n=>S.learners.find(l=>nkey(l.name)===nkey(n));
const N=()=>Math.max(3,Math.min(10,+S.cls.items||5));

/* ---------- clock ---------- */
function clock(h,m,size){const R=Math.PI/180,ha=((h%12)+m/60)*30*R,ma=m*6*R;let t='';
 for(let i=1;i<=12;i++){const a=i*30*R;t+=`<text x="${(50+35*Math.sin(a)).toFixed(1)}" y="${(53.5-35*Math.cos(a)).toFixed(1)}" font-size="10" font-family="Arial" text-anchor="middle" fill="#1c2433">${i}</text>`}
 for(let i=0;i<60;i++){const a=i*6*R,r1=i%5?44:42;t+=`<line x1="${(50+r1*Math.sin(a)).toFixed(1)}" y1="${(50-r1*Math.cos(a)).toFixed(1)}" x2="${(50+46*Math.sin(a)).toFixed(1)}" y2="${(50-46*Math.cos(a)).toFixed(1)}" stroke="#1c2433" stroke-width="${i%5?.6:1.6}"/>`}
 return `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><circle cx="50" cy="50" r="48" fill="#fff" stroke="#1c2433" stroke-width="2.5"/>${t}<line x1="50" y1="50" x2="${(50+21*Math.sin(ha)).toFixed(1)}" y2="${(50-21*Math.cos(ha)).toFixed(1)}" stroke="#1c2433" stroke-width="4.5" stroke-linecap="round"/><line x1="50" y1="50" x2="${(50+36*Math.sin(ma)).toFixed(1)}" y2="${(50-36*Math.cos(ma)).toFixed(1)}" stroke="#1f5fa8" stroke-width="2.6" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#1c2433"/></svg>`}
const h12=x=>((x-1+120)%12)+1;
function tWords(h,m){if(m===0)return`${h} o’clock`;if(m===30)return`half past ${h}`;if(m===15)return`quarter past ${h}`;if(m===45)return`quarter to ${h12(h+1)}`;if(m<30)return`${m} past ${h}`;return`${60-m} to ${h12(h+1)}`}
const pad=n=>String(n).padStart(2,'0');

/* ---------- built-in tasks (generators make a new version every time) ---------- */
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const GOODS=[['🍞','bread'],['🥛','milk'],['🥚','eggs'],['🍎','apples'],['🍚','rice'],['🍌','bananas'],['🧼','soap'],['☕','tea'],['🍅','tomatoes'],['🧅','onions'],['🍗','chicken'],['🧃','juice'],['🥔','potatoes'],['🧻','tissues']];
const SIGNS=[
 ['NO SMOKING','#b0281f','#fff','You cannot smoke here.'],['EXIT','#1b7f45','#fff','This is the way out.'],['PUSH','#1c2433','#fff','Push the door.'],['PULL','#1c2433','#fff','Pull the door.'],
 ['OPEN','#1b7f45','#fff','The shop is open now.'],['CLOSED','#b0281f','#fff','The shop is not open now.'],['WET FLOOR','#e0b100','#1c2433','Be careful. The floor is wet.'],['TOILETS','#1f5fa8','#fff','The toilets are here.'],
 ['NO ENTRY','#b0281f','#fff','Do not go in.'],['OUT OF ORDER','#5b6677','#fff','It does not work.'],['STAFF ONLY','#1c2433','#fff','Only workers can go in.'],['PAY HERE','#1f5fa8','#fff','Pay for your things here.'],
 ['BUS STOP','#b0281f','#fff','Wait here for the bus.'],['DANGER','#e0b100','#1c2433','It is not safe. Keep away.'],['PHARMACY','#1b7f45','#fff','You can buy medicine here.'],['WAITING ROOM','#1f5fa8','#fff','Sit here and wait.']];
const CAPS={
 E1:['My name is Ali.','I live in Hackney.','I am from Somalia.','My birthday is in May.','I go to college on Tuesday.','My son is at school.','I like London.','We have English on Monday.','My teacher is John.','I speak Arabic and English.','Fatima lives in Dalston.','The shop is on Mare Street.','I was born in Kabul.','My daughter is called Sara.','I see the doctor on Friday.','Ahmed is from Eritrea.'],
 E2:['Where do you live?','On Saturday, I went to Ridley Road Market.','My friend Amir works at Homerton Hospital.','Can you help me, please?','In June, we are going to Brighton.','Do you like living in London?','My name is Rosa and I am from Brazil.','What time does the library open?','My brother lives in Manchester, but I live in London.','Last Friday, Maria visited her sister in Leyton.'],
 E3:['Last year, I started college in Hackney, and I really enjoy it.','Could you tell me where Hackney Central station is?','My neighbour, Mrs Patel, works at the GP surgery on Mare Street.','When I arrived in London in January, I did not speak English.','Although it was raining, we went to Victoria Park on Sunday.','Have you ever been to the British Museum?','On Wednesday, Hassan and Leila are going to a job interview.','I would like to make an appointment for next Thursday, please.']};
CAPS.L1=CAPS.E3;
const ORDER={
 E1:['What is your name?','Where do you live?','Where are you from?','What is your phone number?','Do you have children?','Can I help you?','What time is it?','Where is the bus stop?','How much is this?','Do you speak English?','I live in Hackney.','I go to college on Tuesday.','My son is eight.','I like football.','How are you today?'],

function onePer(gen,n){const out=[],seen=new Set();let guard=0;while(out.length<n&&guard++<300){const it=gen();if(!seen.has(it.key)){seen.add(it.key);out.push(it)}}return out}
function fillOpts(correct,cands,mk){const set=[...new Set(cands.filter(c=>c!==correct))];const o=shuffle(set).slice(0,3);let g=0;while(o.length<3&&g++<50){const c=mk();if(c!==correct&&!o.includes(c))o.push(c)}return shuffle([correct,...o])}

    const cands=[p*pc/100,p-pc*100,p*(100-pc/2)/100,c+100,c-100].filter(x=>x>0).map(money);

 days:{title:'Days and months',icon:'📅',target:'I can write the days of the week and the months.',levels:'E1–E2',

/* ---------- open writing (auto-checked features + teacher mark) ---------- */
const WRITE={
 E1:{min:25,avg:15,nl:1,sn:3,link:['and','but','because','then'],ps:['Write about you. Write your name, where you are from, where you live and what you like.','Write about your family. Who is in your family? What do they do?','Write about your day. What do you do in the morning, afternoon and evening?','Write about your home. Where is it? What rooms are there? What do you like about it?']},
 E2:{min:50,avg:20,nl:2,sn:5,link:['and','but','because','so','then','also','after that'],ps:['Write an email to a friend about what you did last weekend.','Write an email to a friend about your English class. When is it? Who is in it? What do you like about it?','Write about a festival or celebration in your country. What do people do?','Write an email to a friend about a trip you went on. Where did you go and what did you do?']},
 E3:{min:80,avg:25,nl:3,para:2,link:['because','so','although','however','also','but','when','if','first','then','finally','after that','for example'],ps:['Write an email to your teacher. You cannot come to class next week. Say why, and ask what work you can do at home.','Write a review of a park, shop or café in Hackney. Describe it and say if you recommend it.','Write an email to your landlord about a problem in your home. Describe the problem and ask for help.','Write about a person who is important to you. Who are they and why are they important?']},
 L1:{min:130,avg:30,nl:3,para:3,link:['however','therefore','in addition','furthermore','moreover','on the other hand','although','whereas','as a result','in conclusion','firstly','finally','for example','because'],ps:['Write an article for the college magazine: “The best and worst things about living in London”.','Write a formal email of complaint to a shop about a product that broke after one week. Explain what happened and what you want them to do.','Write a report for the college about how to make the classrooms better for students. Give at least two ideas, with reasons.','Write an email applying for a volunteer job at a community centre. Describe your skills and experience.']}};
const wcount=t=>(String(t||'').match(/[A-Za-z’']+/g)||[]).length;
function writeCheck(text,lv){const W=WRITE[lv]||WRITE.E1,t=String(text||'').trim(),words=wcount(t);
 const sents=t.split(/(?<=[.?!])\s+|\n+/).map(x=>x.trim()).filter(x=>/[A-Za-z]/.test(x));
 const capOk=sents.length>0&&sents.every(x=>/^[^A-Za-z]*[A-Z]/.test(x))&&!/(^|\s)i(?=[\s'’]|$)/.test(t);
 const lines=t.split(/\n/).map(x=>x.trim()).filter(x=>wcount(x)>=6);
 const endOk=lines.length>0&&lines.every(x=>/[.?!]["”')]?$/.test(x))&&words/Math.max(1,(t.match(/[.?!](\s|$)/g)||[]).length)<=W.avg;
 const low=' '+t.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ')+' ';
 const used=W.link.filter(w=>low.includes(' '+w+' '));
 const paras=t.split(/\n/).filter(x=>wcount(x)>=6).length;
 const checks=[{l:`At least ${W.min} words`,ok:words>=W.min,d:`${words} words`},
  {l:'Every sentence starts with a capital letter (and “I” is a capital)',ok:capOk},
  {l:'Sentences end with . ? or ! (not too long)',ok:endOk},
  {l:`Uses ${W.nl>1?W.nl+' different':'a'} linking word${W.nl>1?'s':''} (${W.link.slice(0,5).join(', ')}…)`,ok:used.length>=W.nl,d:used.join(', ')||'none'},
  W.para?{l:`At least ${W.para} paragraphs`,ok:paras>=W.para,d:`${paras}`}:{l:`At least ${W.sn} sentences`,ok:sents.length>=W.sn,d:`${sents.length}`}];
 let h=esc(t).replace(/(^|[.?!]\s+|\n[ \t]*)([a-z])/g,'$1<span class="err">$2</span>').replace(/(^|\s)(i)(?=[\s&]|$)/g,'$1<span class="err">$2</span>');
 const re=new RegExp('\\b('+W.link.map(w=>w.replace(/ /g,'\\s+')).join('|')+')\\b','gi');h=h.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>'));
 return{checks,score:checks.filter(c=>c.ok).length,max:5,html:h.replace(/\n/g,'<br>')}}
function writeBlock(text,lv,big){const w=writeCheck(text,lv);return`<div class="wtext" ${big?'style="font-size:20px"':''}>${w.html||'<i>(nothing written)</i>'}</div><ul class="wcheck">${w.checks.map(c=>`<li>${c.ok?'✔':'✘'} ${esc(c.l)}${c.d?` <span class="note">(${esc(c.d)})</span>`:''}</li>`).join('')}</ul><p class="note" style="margin:0"><mark style="background:#fff3a0">yellow</mark> = linking words · <span style="color:var(--bad);font-weight:700;text-decoration:underline">red</span> = missing capital letter</p>`}
TASKS.write={title:'Writing',icon:'📝',target:'I can write a short text with correct capital letters, full stops and linking words.',levels:'E1–L1',
 gen(lv){const W=WRITE[lv]||WRITE.E1,p=W.ps[rnd(0,W.ps.length-1)];return[{key:p,type:'write',q:p,prompt:esc(p)+`<div class="note" style="font-size:18px;margin-top:6px">Write at least <b>${W.min}</b> words.</div>`,min:W.min,answer:''}]}};
TASKS.days.only=['E1','E2'];TASKS.signs.only=['E1','E2'];
/* custom task lines → items */
function customGen(c,n){const lines=String(c.lines||'').split('\n').map(s=>s.trim()).filter(Boolean);
 return pickN(lines,n).map(L=>{const p=L.split('|').map(s=>s.trim());
  if(c.type==='choose')return{key:L,type:'choose',q:p[0],show:'',prompt:esc(p[0]),options:shuffle(p.slice(1).filter(Boolean)),answer:p[1]};
  if(c.type==='type')return{key:L,type:'type',q:p[0],show:'',prompt:esc(p[0]),answer:p[1],alts:p.slice(2).filter(Boolean)};
  const s=p[0],m=s.match(/[.?!]$/),end=m?m[0]:'',ws=(end?s.slice(0,-1):s).split(' ');if(ws[0]!=='I')ws[0]=ws[0].toLowerCase();let sh=shuffle(ws),g=0;while(sh.join(' ')===ws.join(' ')&&g++<9)sh=shuffle(ws);
  return{key:L,type:'order',q:`Order: ${sh.join(' / ')} ${end}`,words:sh,end,prompt:'Put the words in order.',answer:s}})}
function taskInfo(id){if(TASKS[id])return TASKS[id];const c=S.custom.find(x=>x.id===id);return c?{title:c.title,icon:c.icon||'⭐',target:c.target||('I can '+c.title.toLowerCase()+'.'),levels:c.level,custom:c}:{title:'(deleted task)',icon:'❔',target:''}}
function makeItems(id,lv){const n=N();if(TASKS[id])return TASKS[id].gen(lv,n);const c=S.custom.find(x=>x.id===id);return c?customGen(c,n):[]}
function allTasks(){return[...Object.keys(TASKS),...S.custom.map(c=>c.id)]}

/* ---------- marking ---------- */
const norm=s=>String(s||'').replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
function mark(it,ans){
 if(it.type==='choose')return ans===it.answer;
 if(it.type==='order')return norm(ans).toLowerCase()===norm(it.answer).toLowerCase();
 if(it.exact)return norm(ans).replace(/\s+([.,?!])/g,'$1')===norm(it.answer);
 const a=norm(ans).toLowerCase();return[it.answer,...(it.alts||[])].some(x=>norm(x).toLowerCase()===a)}

const STAGES=[['initial','Start'],['review','Middle'],['final','End']];

/* stage data: auto from checks (first / middle / latest) or teacher's choice */
function checksFor(l,t){return l.attempts.filter(a=>a.task===t.task&&a.mode==='check').sort((a,b)=>a.date<b.date?-1:1)}
function stages(l,t){
 if(!t.task||t.task==='manual'){const o={};STAGES.forEach(([k])=>{const m=t.manual[k]||{};o[k]=m.score===''||m.score==null?null:{score:+m.score,max:+t.max||5,date:m.date||'',feel:m.feel?+m.feel:null,ev:m.evidence||''}});return o}
 const a=checksFor(l,t),get=id=>a.find(x=>x.id===id),p=t.pick||{};
 const ini=get(p.initial)||a[0]||null,fin=get(p.final)||(a.length>1?a[a.length-1]:null),rev=get(p.review)||(a.length>2?a[Math.floor((a.length-1)/2)]:null);
 const f=x=>x?{score:x.score,max:x.max,date:x.date,feel:x.feel,att:x}:null;return{initial:f(ini),review:f(rev),final:f(fin)}}
function okScore(t,max){return t.ok!==''&&t.ok!=null?+t.ok:Math.ceil(max*.8)}
function status(l,t){const s=stages(l,t);if(!t.text)return['No target yet',''];const i=s.initial,r=s.review,f=s.final;
 if(f){if(f.score>=okScore(t,f.max))return['Achieved','good'];if(i&&f.score>i.score)return['Partly achieved','mid'];return['Not yet achieved','bad']}
 if(r){if(r.score>=okScore(t,r.max))return['Met at middle check','good'];if(i&&r.score>i.score)return['On track','mid'];return['Needs support','bad']}
 return i?['Started','']:['Not started','']}
function change(l,t){const s=stages(l,t),last=s.final||s.review;return s.initial&&last?last.score-s.initial.score:null}
const fmtCh=c=>c==null?'–':(c>0?'+':'')+c;
function highlight(l,t){const s=stages(l,t),last=s.final||s.review,i=s.initial;if(!i||!last)return'';
 const c=last.score-i.score,prac=l.attempts.filter(a=>a.task===t.task&&a.mode==='practice').length;
 return`${esc(l.name.split(' ')[0])} scored <b>${i.score}/${i.max}</b> on ${ukDate(i.date)} and <b>${last.score}/${last.max}</b> on ${ukDate(last.date)} (${c>0?'up '+c:c===0?'no change':'down '+(-c)}).${prac?` Practised ${prac} time${prac>1?'s':''} in between.`:''}${i.feel&&last.feel?` Confidence: ${FACES[i.feel-1][0]} → ${FACES[last.feel-1][0]}.`:''}`}

let found=null;
const NOISE=new Set('student students learner learners name names surname forename forenames first last full id no number ref reference present absent late authorised unauthorised attended attendance register class group course esol e1 e2 e3 l1 l2 entry level mr mrs ms miss dr male female m f yes no n/a na tel phone mobile email dob date age gender status enrolled withdrawn active total am pm teams owner member members guest new city college hackney monday tuesday wednesday thursday friday saturday sunday january february march april may june july august september october november december morning afternoon evening week term semester room lesson'.split(' '));
const tcase=w=>w.split(/([-'’])/).map(x=>/^[-'’]$/.test(x)?x:x.charAt(0).toUpperCase()+x.slice(1).toLowerCase()).join('');
function extractNames(txt){const out=[],seen=new Set(S.learners.map(l=>nkey(l.name)));
 String(txt||'').split(/\r?\n|;|\t{2,}/).forEach(line=>{let L=line.trim();if(!L)return;
  const em=L.match(/\b([a-z][a-z'-]+)[._]([a-z][a-z'-]+)\d*@[^\s,;>)]+/i);L=L.replace(/<?[\w.+-]+@[\w.-]+\.\w+>?/g,' ').replace(/\([^)]*\)|\[[^\]]*\]/g,' ');
  let m=L.match(/^\s*([\p{L}'’-]+(?:\s+[\p{L}'’-]+)?)\s*,\s*([\p{L}'’-]+(?:\s+[\p{L}'’-]+)?)\b/u);
  let toks;
  if(m&&!NOISE.has(m[1].toLowerCase()))toks=[...m[2].split(/\s+/),...m[1].split(/\s+/)];
  else{toks=L.split(/[\s,|\t:]+/).filter(w=>/^[\p{L}][\p{L}'’-]*$/u.test(w)&&!NOISE.has(w.toLowerCase()));
   const caps=toks.filter(w=>w.length>1&&w===w.toUpperCase()),rest=toks.filter(w=>!(w.length>1&&w===w.toUpperCase()));
   if(caps.length&&rest.length)toks=[...rest,...caps]}
  if((!toks||!toks.length)&&em)toks=[em[1],em[2]];
  toks=(toks||[]).filter(w=>!NOISE.has(w.toLowerCase())).slice(0,4);
  if(toks.length<1||(toks.length===1&&toks[0].length<3))return;
  const n=toks.map(tcase).join(' ');if(seen.has(nkey(n)))return;seen.add(nkey(n));out.push(n)});
 return out}

async function zipTexts(buf){const d=new DataView(buf),u8=new Uint8Array(buf);let e=-1;for(let i=buf.byteLength-22;i>=0;i--)if(d.getUint32(i,true)===0x06054b50){e=i;break}if(e<0)throw 0;
 let p=d.getUint32(e+16,true);const cnt=d.getUint16(e+10,true),out=[];
 for(let k=0;k<cnt;k++){const meth=d.getUint16(p+10,true),csz=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),xl=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),off=d.getUint32(p+42,true);
  const name=new TextDecoder().decode(u8.slice(p+46,p+46+nl));p+=46+nl+xl+cl;if(!/\.xml$/.test(name))continue;
  const lo=off+30+d.getUint16(off+26,true)+d.getUint16(off+28,true),raw=u8.slice(lo,lo+csz);
  const data=meth===0?raw:new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());out.push(new TextDecoder().decode(data))}
 return out}
function cellsFromXml(x){const t=[];const doc=new DOMParser().parseFromString(x,'application/xml');doc.querySelectorAll('si,is').forEach(n=>t.push([...n.getElementsByTagName('t')].map(z=>z.textContent).join('')));doc.querySelectorAll('c[t="str"] v').forEach(n=>t.push(n.textContent));return t}
function cellsFromCsv(txt){const out=[];let cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===','||ch==='\n'||ch==='\r'){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}

 if(b.id==='bBackup'||b.id==='bkStat'){doBackup();return}
 if(b.id==='bCsv'){exportCsv();return}
 if(b.id==='bCopy'){studentCopy();return}
 if(b.id==='bLink'){studentLink();return}
 if(b.id==='bLearnerMode'){openLearner();return}
 if(b.id==='pasteBtn'){view='paste';sel=null;found=null;render();return}
 if(b.id==='findNames'){window._pasteTxt=$('#pasteBox').value;found=extractNames(window._pasteTxt);render();return}
 if(b.id==='addFound'){let n=0;found.forEach((x,i)=>{const nm=tidyName($(`[data-fn="${i}"]`).value);if($(`[data-fk="${i}"]`).checked&&nm.length>1&&!byName(nm)){S.learners.push(newLearner(nm));n++}});found=null;window._pasteTxt='';save();view='edit';render();toast(`${n} learner${n===1?'':'s'} added`);return}
 if(b.id==='addL'){const box=$('#newName');const ns=box.value.split(/\n|,/).map(s=>s.trim()).filter(Boolean);if(!ns.length)return;ns.forEach(n=>{if(!byName(n))S.learners.push(newLearner(n))});const last=byName(ns[ns.length-1]);sel=last.id;box.value='';view='edit';save();render();return}
 if(b.id==='wipe'){if(confirm('Delete ALL learners and results on this computer? This cannot be undone without a backup.')){S=blank();sel=null;save();render()}return}
 if(b.dataset.try){R={name:'Teacher preview',preview:true,level:S.cls.level};$('#tm').classList.add('hide');lm.classList.remove('hide');lStart(b.dataset.try,'practice');return}
 if(b.id==='addCu'){S.custom.push({id:'c'+uid(),title:'New task',icon:'⭐',type:'choose',level:S.cls.level,target:'',lines:''});save();render();return}
 if(b.dataset.delcu){if(confirm('Delete this task? Attempts already done stay in the records.')){S.custom=S.custom.filter(c=>c.id!==b.dataset.delcu);save();render()}return}
 if(!l)return;
 if(b.dataset.att){openAtt=openAtt===b.dataset.att?null:b.dataset.att;render();return}
 if(b.dataset.delatt){if(confirm('Delete this attempt?')){l.attempts=l.attempts.filter(a=>a.id!==b.dataset.delatt);save();render()}return}
 if(b.dataset.act==='addT'){l.targets.push(newTarget());save();render();return}
 if(b.dataset.act==='suggest'){const have=l.targets.map(t=>t.task),first={};l.attempts.filter(a=>a.mode==='check').sort((a,b)=>a.date<b.date?-1:1).forEach(a=>{if(!first[a.task])first[a.task]=a});
  const c=Object.values(first).filter(a=>!have.includes(a.task)&&(TASKS[a.task]||S.custom.some(x=>x.id===a.task))&&a.score<okScore({ok:''},a.max)).sort((a,b)=>a.score/a.max-b.score/b.max).slice(0,3-l.targets.length);
  if(!c.length){toast('No first checks below the success score to base a target on');return}c.forEach(a=>l.targets.push(newTarget(a.task)));save();render();toast(`${c.length} target${c.length>1?'s':''} added from first-check results`);return}
 if(b.dataset.act==='delT'){if(confirm('Remove this target? (Attempts are kept.)')){l.targets.splice(+b.dataset.t,1);save();render()}return}
 if(b.dataset.act==='delL'){if(confirm(`Remove ${l.name} and all their records?`)){S.learners=S.learners.filter(x=>x!==l);sel=null;save();render()}return}
 if(b.dataset.act==='rep'){repSel=l.id;view='report';render();return}
});
tm.addEventListener('input',e=>{const el=e.target,l=L();
 if(el.dataset.c){S.cls[el.dataset.c]=el.value;S.cls.upd=Date.now();save();if(el.dataset.c==='form'){clearTimeout(window._fr);window._fr=setTimeout(render,700)}return}
 if(el.dataset.cu){const c=S.custom.find(x=>x.id===el.dataset.id);if(c){c[el.dataset.cu]=el.value;c.upd=Date.now();save(true)}return}
 if(!l)return;
 if(el.dataset.lf){l[el.dataset.lf]=el.dataset.lf==='name'?el.value:el.value;save();if(el.dataset.lf==='name')renderList();return}
 if(el.dataset.tf){l.targets[+el.dataset.t][el.dataset.tf]=el.value;save();return}
 if(el.dataset.tmark){const a=l.attempts.find(x=>x.id===el.dataset.tmark);if(a){if(a.auto==null)a.auto=a.score;a.tmark=el.value===''?null:Math.max(0,Math.min(5,+el.value));a.score=a.tmark==null?a.auto:a.tmark;a.upd=Date.now();save()}return}
 if(el.dataset.mf){const t=l.targets[+el.dataset.t];t.manual[el.dataset.s]=t.manual[el.dataset.s]||{};t.manual[el.dataset.s][el.dataset.mf]=el.value;save();return}});
tm.addEventListener('change',e=>{const el=e.target,l=L();
 if(el.id==='repSel'){repSel=el.value;render();return}
 if(el.id==='pracT'){S.cls.practice=el.checked;save();toast(el.checked?'Practice on – make a new student copy/link':'Practice off – make a new student copy/link');return}
 if(el.id==='fImport'){const sheets=[...el.files].filter(f=>/\.(xlsx|csv)$/i.test(f.name));if(sheets.length){importSheets(sheets);el.value='';return}const fs=[...el.files];let msgs=[],left=fs.length;fs.forEach(f=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);msgs.push(mergeData(d))}catch(x){msgs.push(f.name+': not a results file')}if(--left===0){save(true);render();toast(msgs.length>1?`${fs.length} files: `+msgs.join('; ').slice(0,120):msgs[0])}};r.readAsText(f)});el.value='';return}
 if(el.dataset.c==='level'||el.dataset.c==='items'){render();return}
 if(el.dataset.cu){render();return}
 if(!l)return;
 if(el.dataset.lf==='name'){l.name=tidyName(el.value);save();render();return}
 if(el.dataset.tsel!==undefined){const t=l.targets[+el.dataset.tsel],v=el.value,old=t.task?taskInfo(t.task).target:'';t.task=v;t.pick={};if(v!=='manual'&&(!t.text||t.text===old))t.text=taskInfo(v).target;save();render();return}
 if(el.dataset.pick){const t=l.targets[+el.dataset.t];t.pick=t.pick||{};t.pick[el.dataset.pick]=el.value;save();render();return}
 if(el.dataset.act==='merge'&&el.value){const into=S.learners.find(x=>x.id===el.value);if(confirm(`Move all of ${l.name}'s attempts into ${into.name} and remove ${l.name}?`)){l.attempts.forEach(a=>{if(!into.attempts.some(x=>x.id===a.id))into.attempts.push(a)});if(!into.targets.length)into.targets=l.targets;S.learners=S.learners.filter(x=>x!==l);sel=into.id;save();render()}else el.value='';return}
 if(el.dataset.tf||el.dataset.mf||el.dataset.tmark)render()});

/* ---------- start ---------- */
let startTeacher=false;try{startTeacher=sessionStorage.getItem('rarpa-t')==='1'}catch(e){}
if(/[?&]teacher\b/.test(location.search))startTeacher=true;
if(startTeacher&&!CFG)openTeacher();else lHome();
</script>
